<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      background: #e8f5e9;
      color: #2e7d32;
      display: none;
      text-align: center;
      font-weight: bold;
    }
  </style>

</head>

<body>

  <h2>New Client</h2>

  <label>Account</label>

  <select id="account"></select>

  <label>Client Name</label>

  <input type="text" id="clientName">

  <label>Email</label>

  <input type="email" id="email">

  <label>Phone</label>

  <input type="text" id="phone">

  <label>Address</label>

  <input type="text" id="address">

  <button onclick="createClient()">Create Client</button>

  <div id="message"></div>

  <script>
    google.script.run
  .withSuccessHandler(loadAccounts)
  .getAccounts();

function loadAccounts(accounts) {

  const select = document.getElementById("account");

  select.innerHTML = "";

  accounts.forEach(function(account) {

    const option = document.createElement("option");

    option.value = account[0];
    option.text = account[1];

    select.appendChild(option);

  });

}

function createClient() {

  const message = document.getElementById("message");

  const clientName = document.getElementById("clientName").value.trim();

  if (clientName === "") {

  message.style.display = "block";
  message.style.background = "#fff3cd";
  message.style.color = "#856404";
  message.innerHTML = "⚠️ Please enter a Client Name.";

  return;

}
  const client = {

    accountID: document.getElementById("account").value,
    name: clientName,
    address: document.getElementById("address").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value

  };

  google.script.run
  .withSuccessHandler(clientCreated)
  .createClient(client);

}

function clientCreated() {

  const message = document.getElementById("message");

  message.style.display = "block";
  message.innerHTML = "✅ Client created successfully.";

  document.getElementById("clientName").value = "";
  document.getElementById("address").value = "";
  document.getElementById("email").value = "";
  document.getElementById("phone").value = "";

  setTimeout(function () {

  message.style.display = "none";
  message.innerHTML = "";

}, 2000);

}

  </script>
</body>

</html>
