<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      background: #e8f5e9;
      color: #2e7d32;
      display: none;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>TEST 999</h2>

  <label>Date</label>
  <input type="date" id="jobDate">

  <label>Account</label>
  <select id="account" onchange="loadClients()"></select>

  <label>Client</label>
  <select id="client"></select>

  <label>Contact / Venue</label>
  <input type="text" id="contactVenue">

  <label>Room</label>
  <input type="text" id="room">

  <label>Piano</label>
  <input type="text" id="piano">

  <label>Service</label>
  <select id="service"></select>

  <label>Rate</label>
  <input type="number" id="rate">

  <label>Payment Method</label>
  <select id="payment"></select>

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <!-- CHANGED -->
  <button id="createButton">Create Job</button>

  <div id="message"></div>

  <script>
    google.script.run
      .withSuccessHandler(loadAccounts)
      .getAccounts();

    function loadAccounts(accounts) {

      const select = document.getElementById("account");
      select.innerHTML = "";

      accounts.forEach(function(account) {

        const option = document.createElement("option");
        option.value = account[0];
        option.text = account[1];

        select.appendChild(option);

      });

      loadClients();

    }

    function loadClients() {

      const accountID = document.getElementById("account").value;

      google.script.run
        .withSuccessHandler(populateClients)
        .getClients(accountID);

    }

    function populateClients(clients) {

      const select = document.getElementById("client");
      select.innerHTML = "";

      clients.forEach(function(client) {

        const option = document.createElement("option");
        option.value = client[0];
        option.text = client[1];

        select.appendChild(option);

      });
 
    }

    // CHANGED
    window.onload = function () {

      document
        .getElementById("createButton")
        .addEventListener("click", function () {

         

          createJob();

        });

    };

    function createJob() {

     const job = {

        date: document.getElementById("jobDate").value,
        accountID: document.getElementById("account").value,
        clientID: document.getElementById("client").value,
        contactVenue: document.getElementById("contactVenue").value,
        room: document.getElementById("room").value,
        piano: document.getElementById("piano").value,
        service: document.getElementById("service").value,
        rate: document.getElementById("rate").value,
        paymentMethod: document.getElementById("payment").value,
        notes: document.getElementById("notes").value

      };

      google.script.run
        .withSuccessHandler(jobCreated)
        .createJob(job);

    }

    function jobCreated() {

      const message = document.getElementById("message");

      message.style.display = "block";
      message.innerHTML = "✅ Job created successfully.";

      document.getElementById("jobDate").value = "";
      document.getElementById("contactVenue").value = "";
      document.getElementById("room").value = "";
      document.getElementById("piano").value = "";
      document.getElementById("rate").value = "";
      document.getElementById("notes").value = "";

      setTimeout(function() {

        message.style.display = "none";
        message.innerHTML = "";

      }, 2000);

    }

  </script>

</body>

</html>
